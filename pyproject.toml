[project]
name = "e4-lightingdesign"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy<2.0",
    "pillow>=12.3.0",
    "scipy>=1.11",
    "viser>=1.1.0",
    "trimesh>=4.0.0",
]

[project.optional-dependencies]
# STEP import (Advanced → 3D Models) and STEP panel export; pulls OpenCascade (~300 MB)
step = ["cadquery>=2.4"]

[dependency-groups]
# Installed by default (tool.uv.default-groups) so `uv run`/`uv sync` always
# provide GPU acceleration; raytracing/gpu.py falls back to CPU if no GPU.
gpu = [
    # cupy 14.x requires numpy>=2.0, which conflicts with our numpy<2.0 pin
    # (kept until the Taichi/CuPy stack is re-validated on numpy 2)
    "cupy-cuda12x>=13.0.0,<14",
    "nvidia-cuda-nvrtc-cu12>=12.9.86",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-curand-cu12>=10.3.10.19",
    # Taichi (Vulkan backend) provides GPU acceleration on Intel Arc, AMD, and
    # Apple Silicon GPUs when no NVIDIA/CUDA GPU is present.
    "taichi>=1.7.0",
]

[tool.uv]
default-groups = ["gpu"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lighting_simulator*"]
