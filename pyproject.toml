[project]
name = "e4-lightingdesign"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy<2.0",
    "pillow>=12.3.0",
    "pvtrace>=2.1.6",
    "viser>=1.1.0",
    "trimesh>=4.0.0",
]

[dependency-groups]
# Installed by default (tool.uv.default-groups) so `uv run`/`uv sync` always
# provide CUDA acceleration; gpu_raytrace.py falls back to CPU if no GPU.
gpu = [
    # cupy 14.x requires numpy>=2.0, which conflicts with our numpy<2.0 pin (pvtrace)
    "cupy-cuda12x>=13.0.0,<14",
    "nvidia-cuda-nvrtc-cu12>=12.9.86",
    "nvidia-cuda-runtime-cu12>=12.9.79",
    "nvidia-curand-cu12>=10.3.10.19",
]

[tool.uv]
default-groups = ["gpu"]
